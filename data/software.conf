# DTU Linux Setup – Software Configuration
# This file defines which software packages should be installed.
# Lines starting with # are comments and are ignored.
# Empty lines are ignored.
#
# Format:
#   [section]
#   package_id
#
# Sections: flatpak, snap, pwa, cisco

[flatpak]
com.microsoft.Edge
com.github.tchx84.Flatseal
org.flameshot.Flameshot
org.libreoffice.LibreOffice
com.github.IsmaelMartinez.teams_for_linux
org.remmina.Remmina
us.zoom.Zoom
com.usebottles.bottles
io.github.alescdb.mailviewer
io.gitlab.librewolf-community
io.github.ungoogled_software.ungoogled_chromium

[snap]
# Tom med vilje.
#
# office365webdesktop er erstattet af [pwa] nedenfor. Den var en indpakket
# browser med sin egen opdateringskanal oven i den browser maskinen allerede
# har, og den blev leveret fra latest/beta. PWA-genvejene giver de samme
# apps i Ungoogled Chromium, som står i [flatpak] ovenfor.
#
# Skal en snap installeres, skrives den her som "navn --flag".

[pwa]
# Microsoft 365 web-apps som .desktop-genveje via scripts/install-ms-pwa.sh.
# Genvejene installeres for alle brugere (--system).
#
# Fjern en linje for at udelade appen. Er hele sektionen tom, springes
# trinnet over. Sæt DTU_MS_TENANT for en anden tenant end standarden.
outlook
calendar
word
excel
powerpoint
onenote
onedrive
todo
m365

# Navngiv de Cisco-moduler der skal installeres. Uden linjer installeres kun
# vpn, som er det eneste DTU bruger.
#
# Tarballen indeholder ogsaa posture, nvm, dart og umbrella. Tilfoej dem ikke
# uden at have afproevet dem paa én maskine foerst. posture spoerger om en STI
# og ikke om ja eller nej, saa den afviser "y" og spoerger igen; foer
# september 2026 skrev den 438 GB log og fyldte rodfilsystemet paa en ny
# maskine. Den er nu begraenset, men den installerer stadig ingenting.
[cisco]
vpn
