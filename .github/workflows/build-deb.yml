name: Lint, build and release packages

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 0: Lint — runs on every push/PR, not just releases ──────────────
  # The module scripts run as root and rewrite /etc/fstab, SSSD and polkit
  # config, so a shell bug is expensive. Kept at --severity=warning: the tree
  # is clean at that level, and dropping to "error" would let real defects in.
  lint:
    # Pinned, ikke 'ubuntu-latest': den ruller selv videre til 26.04 og
    # ville aendre hvad der testes paa et tidspunkt ingen har valgt. Hele
    # pointen med 26.04-arbejdet er at vaelge tidspunktet selv.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # desktop-file-validate. Uden den skipper TestDesktopEntries, og en
          # ugyldig .desktop-fil ville nå helt ud på maskinerne.
          sudo apt-get install -y desktop-file-utils
          # Offscreen Qt for the main-window smoke test. If PyQt6 or these
          # libs are unavailable the test skips itself rather than failing the
          # build, so a broken wheel here never blocks a release.
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python3 -m pip install --quiet PyQt6

      - name: Check version strings agree
        run: make check-version

      - name: shellcheck
        run: |
          shellcheck --severity=warning --external-sources \
            bin/*.sh scripts/*.sh scripts/ubuntu/*.sh scripts/standalone/*.sh

      - name: Byte-compile Python
        run: python3 -m compileall -q src/dtu_sustain_setup

      - name: Guard + smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test

  # ── Job 1: Build .deb on Ubuntu ─────────────────────────────────────────
  build-deb:
    needs: lint
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.make_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make dpkg-dev

      - name: Read VERSION from Makefile
        id: version
        shell: bash
        run: |
          MAKE_VERSION="$(grep -E '^[[:space:]]*VERSION[[:space:]]*:=' Makefile | head -n1 | sed -E 's/^[^:]*:=[[:space:]]*//')"
          if [[ -z "$MAKE_VERSION" ]]; then
            echo "Could not parse VERSION from Makefile"
            exit 1
          fi
          echo "make_version=$MAKE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Makefile VERSION: $MAKE_VERSION"

      - name: Validate tag matches Makefile VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAKE_VERSION="${{ steps.version.outputs.make_version }}"
          if [[ "$TAG" != "$MAKE_VERSION" ]]; then
            echo "Version mismatch: tag v$TAG != Makefile VERSION $MAKE_VERSION"
            exit 1
          fi

      - name: Build .deb
        run: make deb

      # The installers (bin/dtu-install.sh, scripts/update-latest.sh) fetch
      # THIS archive, not GitHub's generated /archive/refs/tags tarball. That
      # one is built on request and is not ours to hash; this one is exactly
      # the file sha256sums.txt vouches for.
      - name: Build source archive
        shell: bash
        run: |
          VER="${{ steps.version.outputs.make_version }}"
          git archive --format=tar.gz --prefix="dtu-sustain-setup-${VER}/" \
            -o "dtu-sustain-setup-${VER}.tar.gz" HEAD
          # Listen til en fil, ikke "tar | grep -q": GitHub koerer trinnet med
          # pipefail, og grep -q stopper ved foerste traef, saa tar faar en
          # skrivefejl og hele trinnet fejler, netop naar arkivet er i orden.
          tar -tzf "dtu-sustain-setup-${VER}.tar.gz" > archive-contents.txt
          grep -qx "dtu-sustain-setup-${VER}/Makefile" archive-contents.txt
          rm -f archive-contents.txt

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            *.deb
            dtu-sustain-setup-*.tar.gz
          if-no-files-found: error

  # ── Job 2: Publish release ───────────────────────────────────────────────
  release:
    needs: build-deb
    runs-on: ubuntu-24.04

    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist/

      # Bare file names, no "dist/" prefix: the installers look up their
      # archive by name, and "sha256sum -c" run next to the downloaded files
      # has to find them.
      - name: Compute checksums
        run: |
          (cd dist && sha256sum -- *) > sha256sums.txt
          cat sha256sums.txt
          test "$(grep -c 'dtu-sustain-setup-.*\.tar\.gz$' sha256sums.txt)" -eq 1

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtu-sustain-setup-packages-${{ needs.build-deb.outputs.version }}
          path: |
            dist/
            sha256sums.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DTU Linux Setup v${{ needs.build-deb.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
            sha256sums.txt
          generate_release_notes: true